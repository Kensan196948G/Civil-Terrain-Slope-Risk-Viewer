name: Security

# Secret scanning (gitleaks) と SAST (semgrep) を PR / main push で強制する。
# このリポジトリは private のため GitHub Advanced Security (CodeQL / native secret
# scanning) は課金対象で未有効化 (有効化は人間決裁)。代替として GHAS 非依存の OSS を
# CI ジョブ内で完結させ、検出時はジョブを失敗させる。SARIF を code scanning へ
# アップロードしないため `security-events: write` は不要 (最小権限)。

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: リポジトリ内容の読み取りのみ。
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # 全コミット履歴を走査して過去の混入も検出する。
          fetch-depth: 0

      - name: Install gitleaks (pinned binary)
        run: |
          set -euo pipefail
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Run gitleaks
        run: |
          # detect は作業ツリー + git 履歴を走査し、検出時に exit 1。
          # --redact でログへ実値を出さない。設定は .gitleaks.toml (default 継承)。
          ./gitleaks detect --no-banner --redact --exit-code 1

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep (pinned)
        run: pip install "semgrep==1.171.0"

      - name: Run semgrep (security rulesets, blocking)
        # レジストリの公開ルールセットを実行時取得 (SEMGREP_APP_TOKEN 不要)。
        # node_modules / dist 等の非追跡物は semgrep が自動除外。
        # --error: findings が 1 件でもあれば exit 1。
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/react \
            --config p/secrets \
            --error \
            --metrics off

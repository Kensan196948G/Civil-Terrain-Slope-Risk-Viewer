<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- SVG favicon 非対応・キャッシュ固着ブラウザ向けの ICO フォールバック -->
    <link rel="alternate icon" type="image/x-icon" sizes="32x32" href="/favicon.ico" />
    <meta name="theme-color" content="#e08a2b" />
    <!-- CSP は本番応答ヘッダー (apps/api/src/http.ts) で付与する。
         meta 方式は Vite dev のインライン HMR スクリプトをブロックし、
         開発・E2E を破壊するため使わない (2026-08-12 検証で判明)。 -->
    <title>Civil Terrain &amp; Slope Risk Viewer</title>
    <!-- Design system type (Issue #23): IBM Plex Sans JP / Mono. display=swap
         keeps text visible on the system fallback stack while fonts load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
